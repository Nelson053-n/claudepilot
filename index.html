<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>prof</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23cc785c'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='21' font-weight='700' fill='white' text-anchor='middle'%3Ep%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23cc785c'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='21' font-weight='700' fill='white' text-anchor='middle'%3Ep%3C/text%3E%3C/svg%3E">

<style>
/* ===== Claude / Anthropic-inspired дизайн-система ===== */
:root{
  --bg:#f5f4ef;            /* тёплый кремовый фон */
  --surface:#fbfaf7;
  --card:#ffffff;
  --ink:#1f1d1a;          /* почти-чёрный тёплый */
  --ink-soft:#56524b;
  --muted:#8a847a;
  --line:#e7e3d9;
  --line-2:#dfdacd;
  --clay:#cc785c;         /* фирменный терракотовый акцент */
  --clay-600:#bd6a4f;
  --clay-tint:#f6ece6;
  --olive:#7a8450;
  --sky:#5a7d9a;
  --amber:#c08a2d;
  --red:#b5483a;
  --green:#5f7a4f;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(60,50,40,.05),0 4px 14px rgba(60,50,40,.06);
  --shadow-lg:0 10px 40px rgba(60,50,40,.13);
}
:root[data-theme="dark"]{
  --bg:#1f1d1a; --surface:#272420; --card:#2e2a25; --ink:#f0ece3; --ink-soft:#cfc8bb;
  --muted:#9a9286; --line:#3a352e; --line-2:#443e35; --clay-tint:#3a2a23;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 4px 14px rgba(0,0,0,.25); --shadow-lg:0 12px 40px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:'Source Serif 4',Georgia,serif;letter-spacing:-.01em}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:218px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);
  padding:20px 13px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px;font-family:'Source Serif 4',serif;font-weight:600;font-size:20px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--clay);display:grid;place-items:center;color:#fff;font-size:14px;box-shadow:0 2px 8px rgba(204,120,92,.4)}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-i{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius-sm);color:var(--ink-soft);
  cursor:pointer;font-weight:500;transition:.13s;user-select:none;font-size:13.5px}
.nav-i:hover{background:var(--clay-tint);color:var(--ink)}
.nav-i.active{background:var(--clay);color:#fff;box-shadow:0 2px 8px rgba(204,120,92,.3)}
.nav-i .ico{font-size:15px;width:18px;text-align:center}
.nav-i .badge{margin-left:auto;font-size:11px;background:rgba(0,0,0,.07);padding:1px 8px;border-radius:20px;font-weight:600}
.nav-i.active .badge{background:rgba(255,255,255,.25)}
.side-usage{padding:10px 8px;border-top:1px solid var(--line);margin-top:8px;display:flex;flex-direction:column;gap:7px}
.side-usage .su-row{display:flex;align-items:center;gap:7px;font-size:11px}
.side-usage .su-lbl{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--muted);width:20px}
.side-usage .su-bar{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.side-usage .su-fill{display:block;height:100%;border-radius:6px;transition:width .4s}
.side-usage .su-left{font-size:9.5px;color:var(--muted);white-space:nowrap;min-width:38px;text-align:right}
.side-usage .su-val{font-weight:600;font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.su-cost-lim{font-weight:400;opacity:.7;font-size:10px}
.side-usage .su-cost{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--clay-600);
  background:var(--clay-tint);padding:4px 8px;border-radius:7px;text-align:center;cursor:help}
.side-foot{border-top:1px solid var(--line);padding-top:12px;margin-top:8px;display:flex;gap:6px;align-items:center}
.icon-btn{background:none;border:1px solid var(--line-2);width:32px;height:32px;border-radius:8px;cursor:pointer;
  font-size:15px;color:var(--ink-soft);transition:.13s;display:grid;place-items:center}
.icon-btn:hover{background:var(--clay-tint);border-color:var(--clay)}
/* main */
.main{flex:1;padding:30px 38px;max-width:1600px;min-width:0;overflow-x:hidden}
.head{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.head h1{font-size:27px;font-weight:600}
.head .sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.search{position:relative;min-width:300px}
.search input{width:100%;background:var(--card);border:1px solid var(--line-2);color:var(--ink);
  padding:10px 14px 10px 36px;border-radius:var(--radius-sm);font-size:13.5px;font-family:inherit;box-shadow:var(--shadow)}
.search input:focus{outline:none;border-color:var(--clay)}
.search .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.toggle{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;font-size:12px}
.toggle button{background:var(--card);border:none;padding:7px 12px;cursor:pointer;color:var(--ink-soft);font-family:inherit;font-weight:500}
.toggle button.on{background:var(--clay);color:#fff}
/* buttons */
.btn{background:var(--clay);color:#fff;border:none;padding:10px 17px;border-radius:var(--radius-sm);
  font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;transition:.13s;box-shadow:0 2px 8px rgba(204,120,92,.25)}
.btn:hover{background:var(--clay-600);transform:translateY(-1px)}
.btn.ghost{background:var(--card);color:var(--ink-soft);border:1px solid var(--line-2);box-shadow:var(--shadow)}
.btn.ghost:hover{border-color:var(--clay);color:var(--ink);background:var(--card)}
.btn.ghost.on{background:var(--clay-tint);color:var(--clay-600);border-color:var(--clay)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.danger{background:var(--card);color:var(--red);border:1px solid var(--line-2);box-shadow:none}
.btn.green{background:var(--green);box-shadow:0 2px 8px rgba(95,122,79,.25)}
.btn.green:hover{background:#54703f}
/* cards / grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;
  box-shadow:var(--shadow);transition:.16s;cursor:pointer}
.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--line-2)}
.card h3{font-size:16px;font-weight:600;margin-bottom:6px}
.card .meta{color:var(--muted);font-size:12.5px;display:flex;gap:14px;align-items:center;margin-top:12px}
.pill{font-size:11px;padding:2px 10px;border-radius:20px;font-weight:600;white-space:nowrap}
.pill.todo{background:#f7eede;color:var(--amber)} .pill.feedback{background:#efe9f5;color:#7c5fb0}
.pill.project{background:var(--clay-tint);color:var(--clay-600)} .pill.user{background:#e9f0e3;color:var(--green)}
.pill.reference{background:#eceae4;color:var(--muted)} .pill.memory{background:#eceae4;color:var(--muted)}
.row{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 17px;margin-bottom:9px;cursor:pointer;transition:.13s;box-shadow:var(--shadow)}
.row:hover{border-color:var(--clay);transform:translateX(2px)}
.row .rt{display:flex;align-items:center;gap:10px;margin-bottom:3px}
.row .rtitle{font-weight:600} .row .rdesc{color:var(--ink-soft);font-size:13px}
.row .rsrc{color:var(--muted);font-size:11px;font-family:'JetBrains Mono',monospace;margin-top:4px}
.muted{color:var(--muted)} .back{color:var(--clay);cursor:pointer;font-weight:600;font-size:13px;margin-bottom:14px;display:inline-block}
.back:hover{text-decoration:underline}
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px}
.empty .big{font-size:32px;margin-bottom:10px;opacity:.5}
/* ===== KANBAN ===== */
.stat-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-8px 0 16px}
.stat{font-size:12px;font-weight:600;padding:4px 11px;border-radius:20px;border:1px solid var(--line-2);background:var(--card);color:var(--ink-soft);display:inline-flex;align-items:center;gap:5px}
.stat.run{background:#f7eede;color:var(--amber);border-color:#e6d3a8}
.stat.run::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--amber);animation:pulse 1.1s infinite}
.stat.prop{background:#efe9f5;color:#7c5fb0;border-color:#ddd0ee}
.stat.review{background:#e6eef3;color:var(--sky);border-color:#cdddE8}
.stat.ok{background:#e9f0e3;color:var(--green);border-color:#cfe0c0}
.stat.err{background:#f5e3e0;color:var(--red);border-color:#e8c5bf}
.stat.notdep{background:#f6dede;color:#a23b3b;border-color:#e7bcbc;font-weight:700}
.stat.tot{background:transparent;color:var(--muted);border:none}
.usage{display:flex;gap:14px;align-items:center;margin-left:6px}
.umeter{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-soft)}
.umeter .ulabel{font-weight:700;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px}
.umeter .ubar{width:54px;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.umeter .ufill{display:block;height:100%;border-radius:6px;transition:width .4s}
.umeter .uval{font-weight:600;font-variant-numeric:tabular-nums}
.umeter .uleft{color:var(--muted);font-size:10.5px}
.ucost{font-size:11.5px;font-weight:700;color:var(--clay-600);background:var(--clay-tint);padding:3px 10px;border-radius:20px;font-family:'JetBrains Mono',monospace;cursor:help}
.board-bar{display:flex;gap:10px;margin-bottom:18px;align-items:center;flex-wrap:wrap}
.board-tab{padding:7px 15px;border-radius:20px;border:1px solid var(--line-2);background:var(--card);
  cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-soft);box-shadow:var(--shadow)}
.board-tab.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.board-tab-wrap{position:relative;display:inline-flex;align-items:center}
.board-tab-menu-btn{background:none;border:none;cursor:pointer;font-size:12px;padding:0 4px 0 2px;
  opacity:0;line-height:1;color:inherit;transition:opacity .15s}
.board-tab-wrap:hover .board-tab-menu-btn{opacity:.5}
.board-tab-wrap:hover .board-tab-menu-btn:hover{opacity:1}
.board-tab.active+.board-tab-menu-btn{opacity:.4}
.board-ctx-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:200;background:var(--card);
  border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);min-width:150px;padding:4px 0}
.board-ctx-menu button{display:block;width:100%;text-align:left;background:none;border:none;
  padding:7px 14px;cursor:pointer;font-size:13px;color:var(--ink-soft)}
.board-ctx-menu button:hover{background:var(--line-1);color:var(--ink)}
.board-ctx-menu .danger:hover{color:#e55}
.kanban{display:flex;gap:11px;padding-bottom:8px;align-items:flex-start}
.kcol{flex:1 1 0;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:11px 9px;min-height:140px}
.kcol.dragover{border-color:var(--clay);background:var(--clay-tint)}
.kcol-head{display:flex;align-items:center;gap:6px;margin-bottom:11px;padding:0 3px}
.kcol-head .ct{font-weight:600;font-size:12.5px;line-height:1.2;flex:1;min-width:0} .kcol-head .cn{font-size:11px;color:var(--muted);background:var(--card);padding:1px 7px;border-radius:20px;border:1px solid var(--line);flex-shrink:0}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 13px;margin-bottom:9px;
  box-shadow:var(--shadow);cursor:grab;transition:.12s}
.kcard:hover{box-shadow:var(--shadow-lg)} .kcard:active{cursor:grabbing}
.kcard.dragging{opacity:.5;transform:rotate(1.5deg)}
.kcard.waiting{border-color:var(--amber);animation:kwait 1.4s ease-in-out infinite}
@keyframes kwait{0%,100%{box-shadow:0 0 0 0 rgba(192,138,45,.45)}50%{box-shadow:0 0 0 4px rgba(192,138,45,0)}}
.kc-wait{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--amber);
  background:#f7eede;border:1px solid #e6d3a8;border-radius:6px;padding:1px 6px;margin-bottom:7px}
.kcard{position:relative}
.kcard.scheduled{border-color:var(--sky)}
.kcard.notdep{border-color:#a23b3b;border-left-width:3px;background:#fcf5f5}
.kc-sched{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--sky);
  background:#e6eef3;border:1px solid #cdddE8;border-radius:6px;padding:1px 6px;margin-bottom:7px}
.kc-sched-badge{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--sky);color:#fff;
  box-shadow:var(--shadow)}
.tag.scheduled{background:#e6eef3;color:var(--sky)}
.kcard .kc-top{margin-bottom:5px}
.kc-id{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:0 5px;border-radius:5px;margin-right:5px;vertical-align:1px}
.kc-id-modal{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--clay-600);margin-right:4px}
.kcard .kc-title{font-weight:600;font-size:13.5px;line-height:1.35;flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word}
.kcard .kc-prompt{color:var(--ink-soft);font-size:12px;max-height:48px;overflow:hidden;margin-bottom:7px;
  position:relative;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;transition:max-height .22s ease}
.kcard .kc-prompt.clamped::after{content:"";position:absolute;left:0;right:0;bottom:0;height:20px;
  background:linear-gradient(transparent,var(--card))}
.kc-cost{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:11px;font-family:'JetBrains Mono',monospace}
.kc-cost .cost-tok{color:var(--muted)}
.kc-cost .cost-usd{margin-left:auto;font-weight:600;color:var(--clay-600);background:var(--clay-tint);padding:1px 7px;border-radius:20px}
.kc-live{margin-bottom:7px;display:flex;align-items:center;gap:8px;min-height:14px}
.kc-pulse{display:inline-flex;gap:3px;align-items:center}
.kc-pulse i{width:5px;height:5px;border-radius:50%;background:var(--amber);opacity:.4;animation:kcp 1.2s infinite}
.kc-pulse i:nth-child(2){animation-delay:.2s} .kc-pulse i:nth-child(3){animation-delay:.4s}
@keyframes kcp{0%,100%{opacity:.3;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
.modal-live{background:#1f1d1a;color:#cbd5e1;border-radius:9px;padding:11px 13px;margin:10px 0;
  font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.5;min-height:280px;max-height:460px;overflow:auto;white-space:pre-wrap}
.modal-live-label{font-size:11px;color:var(--amber);font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.kc-live .kc-live-cost{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--clay-600)}
.kcard .kc-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:10px;padding:1px 8px;border-radius:20px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.tag.agent{background:#efe9f5;color:#7c5fb0} .tag.user{background:var(--clay-tint);color:var(--clay-600)}
.tag.uptime{background:#e6eef3;color:var(--sky)} .tag.audit{background:#f7eede;color:var(--amber)}
.tag.running{background:#f7eede;color:var(--amber)} .tag.done{background:#e9f0e3;color:var(--green)}
.tag.failed{background:#f5e3e0;color:var(--red)}
.tag.needs{background:#fde8d4;color:#b5651d;font-weight:700} .tag.interrupted{background:#eceae4;color:var(--muted)}
.tag.paused{background:#e7eef6;color:#3a6398;font-weight:600}
:root[data-theme="dark"] .tag.paused{background:#27313f;color:#7da6d8}
.tag.notdep{background:#f6dede;color:#a23b3b;font-weight:700}
.tag.queued{background:#eceae4;color:var(--muted)}
.vbadge{font-size:10px;padding:1px 8px;border-radius:20px;font-weight:600;cursor:pointer}
.vbadge.ok{background:#e9f0e3;color:var(--green)} .vbadge.bad{background:#f5e3e0;color:var(--red)}
.spin{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.mini{background:none;border:none;cursor:pointer;font-size:13px;opacity:.6;padding:2px;color:var(--ink-soft)}
.mini:hover{opacity:1;color:var(--clay)}
/* status board cards (services/mcp) */
.svc{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 17px;margin-bottom:9px;box-shadow:var(--shadow)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot.up{background:var(--green);box-shadow:0 0 8px rgba(95,122,79,.5)} .dot.down{background:var(--red)} .dot.unknown{background:var(--muted)}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sdot.on{background:var(--green);box-shadow:0 0 7px rgba(95,122,79,.6);animation:pulse 1.4s infinite}
.svc .sname{font-weight:600} .svc .surl{color:var(--muted);font-size:12px;font-family:'JetBrains Mono',monospace}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(40,34,28,.4);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:50px 20px;z-index:50}
.dlg-overlay{z-index:60;background:rgba(40,34,28,.5);align-items:center}
.dlg-modal{max-width:440px}
.toasts{position:fixed;right:18px;bottom:18px;z-index:100;display:flex;flex-direction:column;gap:10px;max-width:360px}
.toast{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--clay);border-radius:var(--radius);
  box-shadow:var(--shadow-lg);padding:13px 16px;font-size:13.5px;color:var(--ink);display:flex;align-items:flex-start;gap:10px;
  animation:toastIn .25s cubic-bezier(.2,.8,.2,1);cursor:default}
.toast.out{animation:toastOut .2s ease forwards}
.toast.ok{border-left-color:var(--green)} .toast.err{border-left-color:var(--red)} .toast.info{border-left-color:var(--sky)}
.toast .t-ico{font-size:16px;line-height:1.3;flex-shrink:0}
.toast .t-body{flex:1}.toast .t-title{font-weight:600;margin-bottom:2px}.toast .t-msg{color:var(--ink-soft);font-size:12.5px}
.toast .t-x{cursor:pointer;opacity:.5;font-size:15px;line-height:1}.toast .t-x:hover{opacity:1}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes toastOut{to{transform:translateX(120%);opacity:0}}
.overlay.show{display:flex}
.modal{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);width:100%;max-width:660px;padding:26px;max-height:84vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal-x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:8px;border:1px solid var(--line-2);background:var(--card);color:var(--ink-soft);cursor:pointer;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:1}
.modal-x:hover{border-color:var(--clay);color:var(--ink)}
.modal.wide{max-width:980px;max-height:90vh}

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const TOKEN='__PROF_TOKEN__';
const auth=(o={})=>{o.headers={...(o.headers||{}),'Authorization':'Bearer '+TOKEN};return o;};
const api=(u,o)=>fetch(u,auth(o)).then(r=>r.json());
const post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});

/* ===================== i18n (RU↔EN) ===================== *
 * Перевод DOM после рендера по словарю фраз ru→en. RU — исходный язык,
 * при выборе EN applyI18n() проходит текстовые узлы + title/placeholder и
 * заменяет известные фразы. Выбор хранится в localStorage('prof_lang'). */
const I18N_EN={
  "Предложено":"Proposed",
  "Подтверждено":"Approved",
  "В работе":"In progress",
  "Проверка":"Review",
  "Готово":"Done",
  "Отклонено":"Rejected",
  "💡 Квоту 5h-окна ест в первую очередь cache_read — перечитывание контекста на каждом ходу. Длинная интерактивная сессия раздувает контекст (пик ctx) → каждый следующий ход дороже. Лекарство — /compact в раздутой сессии (prof не может сделать это за интерактивный чат — только подсказать). Задачи-коворкинг роутятся на Sonnet и обычно дают малую долю.":"💡 The 5h-window quota is eaten first of all by cache_read — re-reading the context on every turn. A long interactive session bloats the context (peak ctx) → each next turn is more expensive. The cure is /compact in the bloated session (prof can't do this for an interactive chat — only hint). Coworking tasks are routed to Sonnet and usually contribute a small share.",
  "Стратегия параллелизма. project — одна задача на проект (защита от гонки записи в файл). worktree — задачи проекта параллельно, каждая в своём git-worktree, результат мерджится в основную ветку (для самого prof worktree отключён → ведёт себя как project). off — без ограничений. Клик — изменить.":"Parallelism strategy. project — one task per project (protection against file-write races). worktree — project tasks run in parallel, each in its own git worktree, the result is merged into the main branch (for prof itself worktree is disabled → behaves like project). off — no limits. Click to change.",
  "💡 Видны ВСЕ сессии Claude Code, не только prof-задачи. ● зелёная — файл сессии писался < 5 мин назад или агент ждёт ввода. Ветка у активных резолвится живьём (git), у остальных — из лога. $ — реальная работа (вход+выход), без раздутого cache_read.":"💡 ALL Claude Code sessions are shown, not just prof tasks. ● green — the session file was written < 5 min ago or the agent is waiting for input. The branch for active sessions is resolved live (git), for the rest — from the log. $ — real work (input+output), without inflated cache_read.",
  "💡 Учитываются ВСЕ сессии Claude Code (~/.claude/projects): терминал, IDE, prof. Стоимость — вход+выход (реальная генерация), без раздутого cache_read. Флаг ⚑ — высокий output/сообщение или низкий cache-hit: кандидаты на оптимизацию промптов.":"💡 ALL Claude Code sessions (~/.claude/projects) are counted: terminal, IDE, prof. Cost is input+output (real generation), without inflated cache_read. Flag ⚑ — high output/message or low cache-hit: candidates for prompt optimization.",
  "💡 Оптимизация: основная экономия — в кэше (cache-read дешевле обычного входа в ~10×). Длинные prompt и частые мелкие задачи на одном проекте переиспользуют кэш. Дроби крупные задачи на одной доске — кэш проекта греется.":"💡 Optimization: the main saving is in the cache (cache-read is ~10× cheaper than regular input). Long prompts and frequent small tasks on one project reuse the cache. Split large tasks on one board — the project cache stays warm.",
  "💡 На какой модели гонялась каждая задача (авто-роутинг). Opus жжёт 5h-окно подписки в ~5× быстрее Sonnet — тяжёлый код стоит на Opus, ревью/анализ роутятся на Sonnet.":"💡 Which model each task ran on (auto-routing). Opus burns the subscription's 5h window ~5× faster than Sonnet — heavy code stays on Opus, reviews/analysis are routed to Sonnet.",
  "Задача выполнена в своём git-worktree, но при мердже ветки prof-card-N в основную возник конфликт. Работа сохранена (ветка и worktree на месте) — домерджи вручную.":"The task was completed in its own git worktree, but merging branch prof-card-N into the main branch caused a conflict. The work is saved (branch and worktree are intact) — merge it manually.",
  "Задача раздулась, а 5h-окно почти исчерпано — поставлена на паузу, чтобы не уронить соседей в session-limit. Доделается автоматически (--resume) в следующем окне.":"The task ballooned and the 5h window is nearly exhausted — it was paused so it won't push neighbors into the session limit. It will finish automatically (--resume) in the next window.",
  "Проверять, что задача реально выкачена: при rc=0 и зелёных тестах, но без нового коммита, карточка уходит в «не выкачено» (🚧), а не в «Готово». Клик — вкл/выкл.":"Check that the task is actually deployed: with rc=0 and green tests but no new commit, the card goes to \"not deployed\" (🚧) instead of \"Done\". Click to toggle on/off.",
  "Агент прочитает файлы и тесты задачи, проверит по факту, выполнена ли она, и перенесёт в «Готово» либо вернёт на доработку.<br><br>~1-3 мин, расходует токены.":"The agent will read the task's files and tests, verify in fact whether it's done, and move it to \"Done\" or send it back for rework.<br><br>~1-3 min, consumes tokens.",
  "Подхватить свежий код с диска (uvicorn reload). Веб-воркер пересоздастся за ~1-2с, claude-задачи переживут. Применять лучше, когда нет активных задач.":"Pick up fresh code from disk (uvicorn reload). The web worker is recreated in ~1-2s, claude tasks survive. Best applied when there are no active tasks.",
  "Лимит одновременно бегущих задач (WIP, по всем доскам). Достигнут — новые встают в очередь и стартуют автоматически. Клик — изменить.":"Limit of simultaneously running tasks (WIP, across all boards). When reached, new ones are queued and start automatically. Click to change.",
  "Агент прочитает проект и память, найдёт техдолг/риски/TODO и предложит задачи в колонку «Предложено» — ты подтвердишь или отклонишь.":"The agent will read the project and memory, find tech debt/risks/TODOs and suggest tasks in the \"Proposed\" column — you'll approve or reject them.",
  "💡 На подписке Opus съедает 5h-окно в ~5× быстрее Sonnet — роутинг переносит ревью/анализ на Sonnet, оставляя Opus для сложного кода.":"💡 On the subscription Opus eats the 5h window ~5× faster than Sonnet — routing moves reviews/analysis to Sonnet, leaving Opus for complex code.",
  "Задачи одного проекта строго последовательно. Защита от гонки записи в общий файл. Разные проекты — параллельно. (рекомендуется)":"Tasks of the same project run strictly sequentially. Protection against races writing to a shared file. Different projects run in parallel. (recommended)",
  "Консоль = ручная работа в Claude Code по этому проекту (не через prof). Считается из live-сессий ~/.claude/projects за 7 дней.":"Console = manual work in Claude Code on this project (not via prof). Computed from live ~/.claude/projects sessions over 7 days.",
  "Агент отрапортовал готово, но сам признал, что результат не выкачен/не закоммичен — на прод/тест не попадёт. Нужна доработка.":"The agent reported done but admitted the result isn't deployed/committed — it won't reach prod/test. Needs more work.",
  "Агент прочитает проект и память, найдёт техдолг/риски/TODO и предложит задачи.<br><br>~1-3 мин, расходует токены.":"The agent will read the project and memory, find tech debt/risks/TODOs and suggest tasks.<br><br>~1-3 min, consumes tokens.",
  "Доступ/права есть, всё разрешено (--dangerously-skip-permissions). Повтори операцию, не спрашивая подтверждений.":"Access/permissions are granted, everything is allowed (--dangerously-skip-permissions). Retry the operation without asking for confirmation.",
  "Впиши решение/ответ сейчас — агент учтёт его и доделает в назначенное окно (продолжит, не с нуля).":"Enter your decision/answer now — the agent will take it into account and finish in the scheduled window (continuing, not from scratch).",
  "Задача будет подтверждена и запущена агентом в папке проекта.<br><br>~1-3 мин, расходует токены.":"The task will be approved and run by the agent in the project folder.<br><br>~1-3 min, consumes tokens.",
  "Достигнут WIP-лимит — задача в очереди, стартует автоматически, как только освободится слот":"WIP limit reached — the task is queued and starts automatically as soon as a slot frees up",

const I18N_KEYS=Object.keys(I18N_EN).sort((a,b)=>b.length-a.length);
let LANG=localStorage.getItem('prof_lang')||'ru';
const hasCyr=s=>/[А-Яа-яЁё]/.test(s);
// перевод одной строки: точное совпадение (trim) → иначе подстрочная замена фраз
function trStr(s){
  if(!s||!hasCyr(s))return s;
  const t=s.trim();
  if(I18N_EN[t]){return s.replace(t,I18N_EN[t]);}
  let out=s;
  for(const k of I18N_KEYS){if(out.includes(k))out=out.split(k).join(I18N_EN[k]);}
  return out;
}
// обход DOM: текстовые узлы + атрибуты title/placeholder. Идемпотентно (data-i18n-done).
function applyI18n(root){
  if(LANG!=='en'||!root)return;
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
  const nodes=[];for(let n=tw.nextNode();n;n=tw.nextNode())nodes.push(n);
  for(const n of nodes){
    if(n.parentNode&&(n.parentNode.tagName==='SCRIPT'||n.parentNode.tagName==='STYLE'))continue;
    if(hasCyr(n.nodeValue)){const v=trStr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  }
  const els=root.querySelectorAll('[title],[placeholder]');
  for(const el of els){
    for(const a of ['title','placeholder']){
      const v=el.getAttribute(a);
      if(v&&hasCyr(v)){const nv=trStr(v);if(nv!==v)el.setAttribute(a,nv);}
    }
  }
}

async function guard(fn){const btn=window.event&&window.event.currentTarget;
  if(btn){if(btn.disabled)return;btn.disabled=true;btn.style.opacity='.5';}
  try{return await fn();}finally{if(btn){btn.disabled=false;btn.style.opacity='';}}}

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function gitRepoName(url){if(!url)return '';try{const u=url.replace(/\.git$/,'');const m=u.match(/[:/]([^/]+\/[^/]+)$/);return m?m[1]:u.split('/').slice(-2).join('/');}catch(e){return url;}}
function ago(ts){if(!ts)return '';const d=Date.now()/1000-ts;if(d<60)return 'только что';if(d<3600)return Math.floor(d/60)+' мин';if(d<86400)return Math.floor(d/3600)+' ч';return Math.floor(d/86400)+' дн';}
function plural(n,one,few,many){const m10=n%10,m100=n%100;if(m10===1&&m100!==11)return one;if(m10>=2&&m10<=4&&(m100<10||m100>=20))return few;return many;}
// «через сколько» до будущего unix-времени (ts — секунды). null → ''
function until(ts){if(!ts)return '';let d=ts-Date.now()/1000;if(d<=0)return 'сейчас';if(d<60)return 'через <1 мин';if(d<3600)return 'через '+Math.floor(d/60)+' мин';if(d<86400)return 'через '+Math.floor(d/3600)+' ч '+Math.floor(d%3600/60)+' м';return 'через '+Math.floor(d/86400)+' дн '+Math.floor(d%86400/3600)+' ч';}
// абсолютное локальное время из unix-секунд (для тултипа). принимает и ISO-строку
function fmtTs(ts){if(!ts)return '';const d=typeof ts==='string'?new Date(ts):new Date(ts*1000);return isNaN(d)?'':d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
// интервал в секундах → человекочитаемо
function ivl(s){if(s==null)return '—';if(s<60)return s+' c';if(s<3600)return (s%60?(s/60).toFixed(0):s/60)+' мин';return (s/3600).toFixed(0)+' ч';}
function md_fallback(t){t=esc(t);t=t.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre>'+c+'</pre>').replace(/`([^`]+)`/g,'<code>$1</code>');
  t=t.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\[\[([^\]]+)\]\]/g,'<code>$1</code>');
  t=t.replace(/^- (.+)$/gm,'<li>$1</li>').replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>').replace(/\n\n/g,'<br><br>');return t;}
function md(t){
  if(typeof marked==='undefined'||typeof DOMPurify==='undefined')return md_fallback(t);
  return DOMPurify.sanitize(marked.parse(t||'',{breaks:true}));
}

function ttsSpeaking(){return ('speechSynthesis'in window)&&(speechSynthesis.speaking||speechSynthesis.pending);}
function stopSpeak(){if('speechSynthesis'in window)speechSynthesis.cancel();updateTtsBtn();}
function updateTtsBtn(){const b=$('#tts-btn');if(!b)return;
  if(ttsSpeaking()){b.textContent='⏹';b.title='Остановить звук';b.style.color='var(--red)';}
  else{b.textContent=S.ttsOn?'🔊':'🔈';b.title=S.ttsOn?'Озвучка вкл — клик выкл':'Озвучка выкл — клик вкл';b.style.color=S.ttsOn?'var(--clay)':'';}}

  S.ttsOn=!S.ttsOn;updateTtsBtn();                   // иначе тоггл вкл/выкл
};
// выбираем самый естественный русский голос: сетевые (Google/Microsoft Online) звучат
// человечнее встроенных. voices грузятся асинхронно — кэшируем при onvoiceschanged.
let _ruVoice=undefined;
function pickRuVoice(){const vs=speechSynthesis.getVoices();if(!vs.length)return null;
  const ru=vs.filter(v=>/ru[-_]?ru|russian|русск/i.test(v.lang+' '+v.name));
  const score=v=>{const n=v.name.toLowerCase();let s=0;
    if(/google/.test(n))s+=5; if(/online|natural|neural/.test(n))s+=4;
    if(/microsoft/.test(n))s+=2; if(v.localService)s-=1; return s;};
  ru.sort((a,b)=>score(b)-score(a));
  return ru[0]||vs.find(v=>/^ru/i.test(v.lang))||null;}
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=()=>{_ruVoice=pickRuVoice();};_ruVoice=pickRuVoice();}
function speak(text){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(text.slice(0,600));
  if(_ruVoice===undefined)_ruVoice=pickRuVoice();
  if(_ruVoice){u.voice=_ruVoice;u.lang=_ruVoice.lang;}else{u.lang='ru-RU';}
  u.rate=0.98;u.pitch=1.0;u.onend=updateTtsBtn;u.onerror=updateTtsBtn;
  speechSynthesis.cancel();speechSynthesis.speak(u);updateTtsBtn();}
// клик по 🔈 у заголовка: играет — стоп, иначе озвучить. Иконка отражает состояние.
function speakToggle(btn,text){if(!('speechSynthesis'in window))return;
  if(ttsSpeaking()){stopSpeak();return;}
  const u=new SpeechSynthesisUtterance(String(text).slice(0,600));
  if(_ruVoice===undefined)_ruVoice=pickRuVoice();
  if(_ruVoice){u.voice=_ruVoice;u.lang=_ruVoice.lang;}else{u.lang='ru-RU';}
  u.rate=0.98;u.pitch=1.0;
  const sync=()=>{btn.textContent=ttsSpeaking()?'⏹':'🔈';updateTtsBtn();};
  u.onend=sync;u.onerror=sync;
  speechSynthesis.cancel();speechSynthesis.speak(u);
  btn.textContent='⏹';updateTtsBtn();}
setInterval(updateTtsBtn,500);  // синхронизируем иконку с реальным состоянием речи

/* ---- голосовой ввод (STT) ---- */
function attachMic(btnId,targetId){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const btn=$('#'+btnId);if(!btn)return;
  if(!SR){btn.style.display='none';return;}
  let rec=null,on=false;
  btn.onclick=()=>{
    if(on){rec&&rec.stop();return;}
    rec=new SR();rec.lang='ru-RU';rec.interimResults=true;rec.continuous=true;
    let base=$('#'+targetId).value;
    rec.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;
      $('#'+targetId).value=(base?base+' ':'')+t;};
    rec.onend=()=>{on=false;btn.classList.remove('rec');};
    rec.start();on=true;btn.classList.add('rec');
  };
}

  // НЕ перерисовываем всю доску по таймеру (это вызывало моргание running-карточек).
  // Живые цифры приходят через SSE (bindStreams). Фолбэк: раз в 8с сверяем снимок
  // состава с API. Раньше сравнивали с Object.keys(S.streams) — а мёртвый SSE-поток
  // не всегда чистится, поэтому a!==b держалось всегда → ререндер каждые 8с (моргание).
  if(running&&!S.poll)S.poll=setInterval(async()=>{
    if(S.view!=='board'){clearInterval(S.poll);S.poll=null;return;}
    try{const cur=await api('/api/cards?board_id='+S.curBoard);
      const snap=cur.map(c=>c.id+':'+c.status+':'+c.column).sort().join('|');
      if(snap!==S._boardSnap)viewBoard($('#main'));  // состав изменился → один ререндер
    }catch(e){}
  },8000);
}

/* ---- live-стриминг прогресса running-карточек (SSE) ---- */
function bindStreams(cards){
  const running=new Set(cards.filter(c=>c.status==='running').map(c=>c.id));
  // закрываем EventSource карточек, которые перестали быть running (или исчезли)
  for(const id in S.streams){ if(!running.has(+id)){S.streams[id].close();delete S.streams[id];} }
  // открываем поток для каждой running-карточки (один раз — переживает re-render)
  running.forEach(id=>{
    if(S.streams[id])return;
    const es=new EventSource('/api/cards/'+id+'/stream');
    S.streams[id]=es;
    es.onmessage=e=>{
      let d;try{d=JSON.parse(e.data);}catch{return;}
      if(d.done){es.close();delete S.streams[id];viewBoard($('#main'));return;}
      // карточка в списке: ТОЛЬКО спокойные цифры (без моргающего текста консоли)
      const box=document.getElementById('live-'+id);
      const cst=box&&box.querySelector('.kc-live-cost');
      if(cst){const parts=[];
        if(d.running_cost!=null)parts.push('$'+d.running_cost.toFixed(d.running_cost<0.01?4:2));
        if(d.input_tokens!=null||d.output_tokens!=null)parts.push('↓'+tok(d.input_tokens||0)+' ↑'+tok(d.output_tokens||0));
        const txt=parts.join(' · ');
        if(cst.textContent!==txt)cst.textContent=txt;}  // не перезаписываем тем же → без мелькания
      // живой текст консоли — только если ЭТА карточка открыта в модалке
      if(S.openCardId===+id){const mt=document.getElementById('modal-live-text');
        if(mt&&d.last_text!=null&&mt.textContent!==d.last_text)mt.textContent=d.last_text;}
    };
    es.onerror=()=>{};  // EventSource сам реконнектит; финализацию подхватит 8с-поллер
  });
}

// unix-секунды → 'ЧЧ:ММ' (или 'дд.мм ЧЧ:ММ', если не сегодня) в локальном времени
function fmtSchedTime(ts){

// множители оценки относительно средней задачи проекта:
// обычная задача ~1.0× (чтение+запись), анализ ~0.8×, проверка ~0.6× (только чтение+тесты)
const EST_MULT={task:1.0,analyze:0.8,review:0.6};
// Честная оценка стоимости запуска по реальной статистике проекта (avg по slug,
// fallback на среднюю по всем). Плюс гард по 5h-лимиту. Возвращает {html, estVal}.
async function estCost(kind,slug){
  const mult=EST_MULT[kind]??1.0;let html='',estVal=null,overLimit=false;
  try{const cc=await api('/api/cards/cost');
    const bs=slug&&cc.by_slug&&cc.by_slug[slug];
    const base=bs?bs.avg_cost_usd:cc.avg_cost_usd, n=bs?bs.tasks:cc.tasks_with_cost;
    if(base){estVal=base*mult;
      const src=bs?'средней задаче этого проекта':'средней по всем проектам';
      html+=`<br><b>≈$${estVal.toFixed(2)}</b> (оценка по ${src} $${base.toFixed(2)}, n=${n})`;}
  }catch(e){}
  try{const u=await api('/api/usage');
    if(u.available&&u.five_hour&&u.five_hour.util>90){overLimit=true;
      html+=`<br><span style="color:var(--red);font-weight:600">⚠ лимит почти исчерпан — осталось ${100-u.five_hour.util}% (5ч), запуск может не завершиться</span>`;}
  }catch(e){}
  return {html,estVal,overLimit};
}

// Запуск без подтверждения. Модалку показываем только если 5h-лимит почти исчерпан
// (запуск может не завершиться) — тогда даём явно подтвердить/отменить. Возвращает true=запускать.
async function confirmRun(id,kind,text,okText){
  let slug='';try{const cards=await api('/api/cards?board_id='+S.curBoard);const c=cards.find(x=>x.id===id);if(c)slug=c.slug;}catch(e){}
  const {html,overLimit}=await estCost(kind,slug);
  if(!overLimit)return true;
  return showConfirm(`${text}<br><br>~1-3 мин, расходует токены.${html}`,
    {title:'▶ Запуск',okText:okText||'Всё равно запустить',cancelText:'Отмена'});
}
async function saveAndRun(id){
  if(!await confirmRun(id,'task','Задача будет перезапущена с нуля по текущему заданию.','С нуля'))return;
  const body=JSON.stringify({title:$('#ec-title').value,prompt:$('#ec-prompt').value});
  closeModal();
  await api('/api/cards/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body});
  await post(`/api/cards/${id}/run`);viewBoard($('#main'));
}

async function reviewAgent(id){
  // получим заголовок и slug карточки для оценки и тостов
  let ttl='#'+id,slug='';
  try{const cards=await api('/api/cards?board_id='+S.curBoard);const c=cards.find(x=>x.id===id);if(c){ttl='#'+id+' '+c.title;slug=c.slug;}}catch(e){}
  // оценка стоимости проверки (~60% средней задачи — только чтение+тесты, без записи)
  const {html:est,estVal}=await estCost('review',slug);
  const ok=await showConfirm(
    `Агент прочитает файлы и тесты задачи, проверит по факту, выполнена ли она, и перенесёт в «Готово» либо вернёт на доработку.<br><br>~1-3 мин, расходует токены.${est}`,
    {title:'🔍 Агентная проверка',okText:'Проверить',cancelText:'Отмена'});
  if(!ok)return;
  closeModal();
  toast(`Проверяю «${esc(ttl)}»…`,{title:'🔍 Проверка запущена',type:'info',timeout:5000});
  post(`/api/cards/${id}/review-agent`)
    .then(r=>{
      viewBoard($('#main'));
      const planned=estVal!=null?`планировали ≈$${estVal.toFixed(2)}`:'';
      const actual=r.review_cost!=null?`фактически $${r.review_cost.toFixed(2)}`:'';
      const cost=[planned,actual].filter(Boolean).join(' · ');
      const tail=cost?`<br><span style="opacity:.7;font-size:11px">${cost}</span>`:'';
      if(r.verdict==='done')toast(`«${esc(ttl)}» — перенесена в «Готово».${tail}`,{title:'✓ Проверка пройдена',type:'ok',timeout:9000});
      else toast(`«${esc(ttl)}» — возвращена на доработку.${tail}`,{title:'✗ Не пройдена',type:'err',timeout:9000});
    })
    .catch(e=>toast('Ошибка проверки: '+e,{title:'✕ Ошибка',type:'err'}));
}

  <p class="md">Агент прочитает проект и память, найдёт техдолг/риски/TODO и предложит задачи в колонку «Предложено» — ты подтвердишь или отклонишь.</p>
  <div class="field" style="margin-top:14px"><label>Проект</label><select id="an-slug">${S.projects.map(p=>`<option value="${p.slug}">${esc(p.name)}</option>`).join('')}</select></div>
  <div class="warn">Запустит headless claude (~1-3 мин). Можно закрыть окно — результат появится на доске.</div>
  <div class="m-actions"><button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn" onclick="runAnalyze()">Запустить анализ</button></div>`);}
async function runAnalyze(){const slug=$('#an-slug').value;
  const {html}=await estCost('analyze',slug);
  const ok=await showConfirm(`Агент прочитает проект и память, найдёт техдолг/риски/TODO и предложит задачи.<br><br>~1-3 мин, расходует токены.${html}`,
    {title:'✦ Анализ слабых мест',okText:'Запустить анализ',cancelText:'Отмена'});
  if(!ok)return;
  // окно «выполняется» с крестиком (showModal добавляет modal-x) + кнопкой
  // «Свернуть»: анализ идёт на сервере, окно можно закрыть, не дожидаясь.
  showModal(`<h2>✦ Анализирую…</h2><p class="md">Агент читает проект. Это займёт до 3 минут.<br>Можно закрыть это окно — анализ продолжится в фоне, задачи появятся на доске.</p>
    <div class="result-box">⏳ выполняется…</div>
    <div class="m-actions"><button class="btn ghost" onclick="closeModal()">Свернуть</button></div>`);
  let r;
  try{
    r=await post('/api/analyze/'+slug);
  }catch(e){
    if(S.view==='board')toast('Анализ не запустился: '+e,{title:'✦ Ошибка',type:'err'});
    return;  // окно уже закрываемо (крестик/Свернуть)
  }
  // пользователь мог свернуть окно — не навязываем результат поверх
  if(!$('#overlay').classList.contains('show')){
    toast(`Анализ готов: предложено задач ${r.suggested}`,{title:'✦ Анализ',type:'ok'});
    return;
  }
  $('#modal').innerHTML='<button class="modal-x" title="Закрыть" onclick="closeModal()">×</button>'+
    `<h2>Готово</h2><p class="md">Предложено задач: <strong>${r.suggested}</strong>. Открой доску проекта.</p>
    ${r.raw?`<div class="result-box">${esc(r.raw)}</div>`:''}
    <div class="m-actions"><button class="btn" onclick="closeModal();S.curBoard=${r.board_id};loadBoardMeta().then(()=>viewBoard($('#main')))">К доске</button></div>`;
}

    <button class="btn ghost sm" onclick="syncAllProjects()">↻ Синхр. все</button>
    <button class="btn" onclick="openNewProject()">+ Проект</button>

    <div class="search"><span class="si">⌕</span><input id="gs" placeholder="поиск по памяти…"></div></div>
    <div class="grid" id="pg">${ps.map(p=>`<div class="card" data-slug="${p.slug}">
      <h3>${esc(p.name)}</h3>
      ${p.git_remote?`<div class="muted" style="font-size:12px;margin:-4px 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(p.git_remote)}">⎇ ${esc(gitRepoName(p.git_remote))}${p.git_branch?' · '+esc(p.git_branch):''}</div>`:''}

      <span class="spacer"></span><span class="muted">${ago(p.last_activity)}</span></div></div>`).join('')}</div>`;

  $('#sm-text').onclick=()=>{mode='text';$('#sm-text').classList.add('on');$('#sm-vec').classList.remove('on');};
  $('#sm-vec').onclick=()=>{mode='vector';$('#sm-vec').classList.add('on');$('#sm-text').classList.remove('on');};
  $$('#pg .card').forEach(c=>c.onclick=()=>openProject(c.dataset.slug));
  let t;$('#gs').oninput=e=>{clearTimeout(t);t=setTimeout(()=>doSearch(e.target.value,mode),280);};

async function doSearch(q,mode){
  if(q.trim().length<2){viewProjects($('#main'));return;}
  const hits=await api(`/api/search?mode=${mode}&q=`+encodeURIComponent(q));const g=$('#pg');
  g.innerHTML=hits.length?hits.map(h=>`<div class="row" data-slug="${h.slug||''}" data-file="${h.file||h.ref||''}">
    <div class="rt"><span class="rtitle">${esc(h.name||h.title)}</span>
      ${h.project?`<span class="pill project">${esc(h.project)}</span>`:''}
      ${h.score!=null?`<span class="pill memory">${(h.score*100).toFixed(0)}%</span>`:''}</div>
    <div class="rdesc">…${esc(h.snippet||'')}…</div></div>`).join(''):'<div class="empty">Ничего не найдено</div>';
  g.style.display='block';
  $$('#pg .row').forEach(r=>r.onclick=()=>{if(r.dataset.slug)openProject(r.dataset.slug);});
}
async function openProject(slug,focus){

  const gitLine=proj&&proj.git_remote?`<div class="muted" style="font-size:13px;margin:-6px 0 10px">⎇ <a href="${esc(proj.git_remote)}" target="_blank" rel="noopener" style="color:inherit">${esc(proj.git_remote)}</a>${proj.git_branch?` · ветка <code>${esc(proj.git_branch)}</code>`:''}</div>`:'';
  $('#main').innerHTML=`<span class="back" onclick="render()">← Проекты</span>
    <div class="head"><h1>${esc(proj?proj.name:slug)}</h1><div class="spacer"></div>
      <button id="dc-toggle" class="btn ghost sm" title="Проверять, что задача реально выкачена: при rc=0 и зелёных тестах, но без нового коммита, карточка уходит в «не выкачено» (🚧), а не в «Готово». Клик — вкл/выкл." onclick="toggleDeployCheck('${slug}')">🚧 …</button>
      ${proj&&proj.description!==undefined?`<button class="btn ghost sm" onclick="rescanProject('${slug}')">↻ Пересканировать</button>`:''}

    <div>${items.map(it=>`<div class="row" data-file="${it.file}">
      <div class="rt"><span class="rtitle">${esc(it.name)}</span><span class="pill ${it.type}">${it.type}</span>
        ${it.has_todo?'<span class="pill todo">TODO</span>':''}</div>
      <div class="rdesc">${esc(it.description)}</div><div class="rsrc">${it.file} · ${ago(it.mtime)}</div></div>`).join('')}</div>`;
  $$('#main .row').forEach(r=>r.onclick=()=>{const it=items.find(x=>x.file===r.dataset.file);
    showModal(`<h2>${esc(it.name)} <span class="pill ${it.type}">${it.type}</span>
      <span class="spk" onclick="speakToggle(this,${JSON.stringify(it.body).replace(/"/g,'&quot;')})">🔈</span></h2>
      <div class="md">${md(it.body)}</div>

  refreshDeployCheck(slug);
}

async function rescanProject(slug){

async function refreshDeployCheck(slug){
  const b=$('#dc-toggle');if(!b)return;
  const r=await api('/api/settings/deploy-check/'+slug).catch(()=>({enabled:false}));
  b.dataset.on=r.enabled?'1':'';
  b.classList.toggle('on',r.enabled);
  b.textContent='🚧 Проверять выкатку'+(r.enabled?': вкл':': выкл');
}
async function toggleDeployCheck(slug){
  const b=$('#dc-toggle');const next=b.dataset.on!=='1';
  await post('/api/settings/deploy-check/'+slug,{enabled:next});
  toast(next?'Проверка выкатки включена':'Проверка выкатки выключена');
  refreshDeployCheck(slug);
}
// Баннер «прод отстаёт от origin» — отдельный фоновый аудит (запушено, но не задеплоено).
// Показывается только при lag>0 / ошибке проверки. lag=0 и «нет команды» — баннера нет.
function prodLagBanner(slug,r){
  if(!slug||!r)return '';
  if(r.error&&r.error!=='no_cmd'){
    return `<div class="prod-banner err"><span class="pb-ico">⚠️</span>
      <div><div class="pb-title">Не удалось проверить прод (${esc(slug)})</div>
      <div class="pb-msg">Команда проверки прод-HEAD вернула ошибку: <code>${esc(String(r.error).slice(0,160))}</code></div></div>
      <button class="btn ghost sm" onclick="refreshProdLag()">↻ Перепроверить</button></div>`;
  }
  if(r.ok&&(r.lag>0||r.lag===-1)){
    const txt=r.lag===-1?'на неизвестном коммите (не из origin)':`отстаёт на ${r.lag} ${plural(r.lag,'коммит','коммита','коммитов')}`;
    return `<div class="prod-banner"><span class="pb-ico">🚀</span>
      <div><div class="pb-title">Прод ${txt} — задеплой!</div>
      <div class="pb-msg">Код запушен в <code>origin/${esc(r.branch||'')}</code>, но на сервере его ещё нет. Изменения не у пользователей.</div>
      <div class="pb-meta">prod <code>${esc((r.prod_head||'').slice(0,7))}</code> · origin <code>${esc((r.origin_head||'').slice(0,7))}</code></div></div>
      <button class="btn ghost sm" onclick="refreshProdLag()">↻ Перепроверить</button></div>`;
  }
  return '';
}

  toast('Проверяю прод…');

  if(S.view==='board')viewBoard($('#main'));
}

    ${list.length?list.map(s=>{const up=s.last_status&&s.last_status<400;const st=s.last_status?(up?'up':'down'):'unknown';
      return `<div class="svc"><span class="dot ${st}"></span>
        <div style="flex:1"><div class="sname">${esc(s.name)}</div><div class="surl">${esc(s.url)}</div></div>

// Разбивка prof-задач по модели (cards.model, авто-роутинг). Показываем, только
// если есть задачи с реальной моделью — иначе колонка ещё не заполняется и секцию
// пропускаем (карты до роутинга идут в 'unknown'). Opus подсвечен — дорогой по окну.
function renderCardsByModel(bm){
  if(!bm)return '';
  const order=['opus','sonnet','haiku'];
  const real=order.filter(t=>bm[t]&&bm[t].tasks>0);
  if(!real.length)return '';  // только unknown → роутинг ещё не пишет model
  const totCost=real.reduce((s,t)=>s+(bm[t].cost||0),0)||1;
  const tierLbl={opus:'Opus',sonnet:'Sonnet',haiku:'Haiku'};
  const unk=bm.unknown;
  const cards=real.map(t=>{
    const r=bm[t],share=Math.round((r.cost||0)/totCost*100),isOpus=t==='opus';
    return `<div class="cost-card${isOpus?' warn':''}">
      <div class="cc-label">${tierLbl[t]}${isOpus?' <span class="flag" title="Opus съедает 5h-окно подписки в ~5× быстрее Sonnet">⬆ дорогой по окну</span>':''}</div>
      <div class="cc-val">$${(r.cost||0).toFixed((r.cost||0)<0.01?4:2)}</div>
      <div class="cc-sub">${share}% · ${r.tasks} задач · ↓${tok(r.input)} ↑${tok(r.output)}</div></div>`;
  }).join('');
  return `<div class="section-h">Расход по моделям (задачи)</div>
    <div class="cost-grid">${cards}</div>
    <p class="note" style="margin-top:10px">💡 На какой модели гонялась каждая задача (авто-роутинг). Opus жжёт 5h-окно подписки в ~5× быстрее Sonnet — тяжёлый код стоит на Opus, ревью/анализ роутятся на Sonnet.${unk&&unk.tasks?` <span style="opacity:.7">${unk.tasks} задач без метки модели (запуски до роутинга).</span>`:''}</p>`;
}

// «Расход по моделям»: opus/sonnet/haiku за период. Подсветка Opus — он жжёт
// 5h-окно подписки в ~5× быстрее Sonnet. Если данных по моделям нет — пусто.
function renderByModel(bm,days){
  if(!bm)return '';
  const order=['opus','sonnet','haiku'];
  const rows=order.map(t=>({tier:t,...(bm[t]||{cost:0,input:0,output:0,messages:0})})).filter(r=>r.messages>0);
  if(!rows.length)return '';
  const totCost=rows.reduce((s,r)=>s+(r.cost||0),0)||1;
  const tierLbl={opus:'Opus',sonnet:'Sonnet',haiku:'Haiku'};
  const cards=rows.map(r=>{
    const share=Math.round((r.cost||0)/totCost*100);
    const isOpus=r.tier==='opus';
    return `<div class="cost-card${isOpus?' warn':''}">
      <div class="cc-label">${tierLbl[r.tier]}${isOpus?' <span class="flag" title="Opus съедает 5h-окно подписки в ~5× быстрее Sonnet">⬆ дорогой по окну</span>':''}</div>
      <div class="cc-val">$${(r.cost||0).toFixed((r.cost||0)<0.01?4:2)}</div>
      <div class="cc-sub">${share}% расхода · ${r.messages} сообщ · ↓${tok(r.input)} ↑${tok(r.output)}</div></div>`;
  }).join('');
  return `<div class="section-h">Расход по моделям</div>
    <div class="cost-grid">${cards}</div>
    <p class="note" style="margin-top:10px">💡 На подписке Opus съедает 5h-окно в ~5× быстрее Sonnet — роутинг переносит ревью/анализ на Sonnet, оставляя Opus для сложного кода.</p>`;
}

// Дашборд «кто жрёт квоту 5h-окна»: интерактив (наш чат/терминал/IDE) vs
// задачи-коворкинг (claude -p от prof). Метрика — ТОКЕНЫ (их ест лимит, в первую
// очередь cache_read). Баннер-совет на /compact для раздутой интерактив-сессии.
async function renderCostQuota(m){
  const d=await api('/api/quota/breakdown?hours=5');
  const t=d.totals||{}, w=d.window||{}, adv=d.advice;
  const sess=d.sessions||[];
  // короткий id сессии для таблицы
  const sid=s=>(s||'').slice(0,8);
  const kindLbl={interactive:'чат/консоль',task:'задача'};
  // бар-доля интерактив/задачи
  const ip=t.interactive_pct||0, tp=t.task_pct||0;
  const banner=adv?`<div class="quota-banner">
      <div class="qb-ico">🔴</div>
      <div class="qb-body">
        <div class="qb-title">Раздутая сессия жрёт квоту</div>
        <div class="qb-msg">${esc(adv.message)}</div>
        <div class="qb-meta">сессия <code>${sid(adv.session_id)}</code> · «${esc(adv.project)}» · пик контекста ${Math.round(adv.peak_ctx/1000)}K · ${tok(adv.tokens)} токенов за окно</div>
      </div></div>`:
    `<div class="quota-ok">✓ Раздутых интерактивных сессий нет — квота расходуется ровно.</div>`;
  m.innerHTML=`${banner}
    <div class="cost-grid">
      ${ccCard('Токенов за 5ч',tok(t.tokens||0),`${t.sessions||0} сессий${w.util!=null?` · окно ${w.util}% выбрано`:''}`)}
      ${ccCard('Интерактив (чат/консоль)',ip+'%',`${tok(t.interactive_tokens||0)} · ${t.interactive_sessions||0} сесс.`)}
      ${ccCard('Задачи-коворкинг',tp+'%',`${tok(t.task_tokens||0)} · ${t.task_sessions||0} сесс.`)}
      ${ccCard('Окно сбросится',w.left||'—',w.util!=null?`утилизация ${w.util}%`:'лимит недоступен')}
    </div>
    <div class="quota-split" title="Доля нагрузки на 5h-окно: интерактивные сессии vs задачи prof">
      <div class="qs-bar">
        <div class="qs-inter" style="width:${ip}%" title="Интерактив ${ip}%">${ip>=12?ip+'% чат/консоль':''}</div>
        <div class="qs-task" style="width:${tp}%" title="Задачи ${tp}%">${tp>=12?tp+'% задачи':''}</div>
      </div>
    </div>
    <div class="section-h">Сессии за 5ч-окно (по нагрузке на квоту)</div>
    ${sess.length?`<table class="cost-table">
      <thead><tr><th>Сессия</th><th>Тип</th><th>Проект</th><th>Модель</th>
        <th title="всего токенов за окно — это ест квоту">Токены</th>
        <th title="пик контекста = cache_read+create в одном ходу; большой → каждый ход дорогой">Пик ctx</th>
        <th title="сообщений в окне">Сообщ.</th></tr></thead>
      <tbody>${sess.map(s=>{
        const isOpus=s.model==='opus';
        return `<tr class="${s.bloated?'warn':''}">
        <td><code>${sid(s.session_id)}</code>${s.bloated?'<span class="flag" title="Контекст раздут — сделай /compact в этой сессии">🔴 раздута</span>':''}</td>
        <td><span class="qk qk-${s.kind}">${kindLbl[s.kind]||s.kind}</span></td>
        <td>${esc(s.project)}</td>
        <td>${s.model}${isOpus?' <span class="flag" title="Opus жжёт окно в ~5× быстрее Sonnet">⬆</span>':''}</td>
        <td class="c-usd">${tok(s.tokens)}</td>
        <td>${Math.round(s.peak_ctx/1000)}K</td>
        <td>${s.messages}</td></tr>`;}).join('')}</tbody>
    </table>`:'<div class="empty"><div class="big">⛁</div>Нет активных сессий за последние 5 часов.</div>'}
    <p class="note" style="margin-top:18px">💡 Квоту 5h-окна ест в первую очередь <b>cache_read</b> — перечитывание контекста на каждом ходу. Длинная интерактивная сессия раздувает контекст (пик ctx) → каждый следующий ход дороже. Лекарство — <b>/compact</b> в раздутой сессии (prof не может сделать это за интерактивный чат — только подсказать). Задачи-коворкинг роутятся на Sonnet и обычно дают малую долю.</p>`;
}

async function renderCostSessions(m){
  const d=await api('/api/cost/sessions?days=7');
  const per=d.period||{}, days=d.period_days||7;
  const tin=per.input||0, tout=per.output||0, tcr=per.cache_read||0;
  // доля cache_read среди всего «входа» (вход + кэш-чтение): высокая = хорошо
  const cacheShare=(tin+tcr)?Math.round(tcr/(tin+tcr)*100):0;
  // подсветка аномалий: по проектам с заметным расходом — высокий output/сообщение
  // или низкая доля cache_read относительно медианы → кандидат на оптимизацию промптов.
  const projs=(d.by_project||[]).filter(p=>p.messages>0);
  const sig=projs.filter(p=>p.cost>=0.5);  // только заметные проекты — иначе шум
  const med=arr=>{if(!arr.length)return 0;const s=[...arr].sort((a,b)=>a-b);const i=s.length>>1;return s.length%2?s[i]:(s[i-1]+s[i])/2;};
  const medOut=med(sig.map(p=>p.output/p.messages));
  const flag=p=>{
    if(p.cost<0.5)return null;
    const outPer=p.output/p.messages, share=(p.input+p.cache_read)?p.cache_read/(p.input+p.cache_read):1;
    if(medOut&&outPer>medOut*2)return `output/сообщ ${tok(Math.round(outPer))} — вдвое выше медианы, длинные ответы дороги (×5 от входа)`;
    if(share<0.5)return `cache-hit ${Math.round(share*100)}% — низкий, контекст перечитывается без кэша`;
    return null;
  };
  // by_day: {day:{cost,input,output,messages}} — разбивка по дню
  const dayEntries=Object.entries(d.by_day||{});
  const dayCost=v=>(v&&typeof v==='object')?(v.cost||0):(v||0);  // совместимость со старым {day:cost}
  const maxDay=Math.max(0,...dayEntries.map(([,v])=>dayCost(v)))||1;
  const periodCost=dayEntries.reduce((s,[,v])=>s+dayCost(v),0);
  const bars=dayEntries.map(([day,v])=>{const c=dayCost(v);return `<div class="daybar" title="${day}: $${c.toFixed(2)}">
      <div class="db-val">${c>=0.01?'$'+c.toFixed(c<1?2:0):''}</div>
      <div class="db-fill" style="height:${Math.max(2,c/maxDay*100)}%"></div>
      <div class="db-lbl">${day.slice(5)}</div></div>`;}).join('');
  // таблица по дням: дата убыв., подсветка дней-максимумов
  const dayRows=[...dayEntries].reverse().map(([day,v])=>{
      const c=dayCost(v),isMax=c>=maxDay&&c>0;
      const inp=(v&&v.input)||0,out=(v&&v.output)||0,msg=(v&&v.messages)||0;
      const sh=periodCost?Math.round(c/periodCost*100):0;
      return `<tr class="${isMax?'warn':''}"><td>${day}${isMax?'<span class="flag">⬆ пик</span>':''}</td>
        <td>${msg}</td><td>${tok(inp)} / ${tok(out)}</td><td>${sh}%</td>
        <td class="c-usd">$${c.toFixed(c<0.01?4:2)}</td></tr>`;}).join('');
  const flagged=projs.filter(p=>flag(p)).length;
  m.innerHTML=`<div class="cost-grid">
      ${ccCard('Всего за '+days+' дн','$'+(per.cost_usd||0).toFixed(2),`полный API-экв ≈$${per.cost_full_usd||0}`)}
      ${ccCard('Окно 5ч','$'+((d.window_5h||{}).cost_usd||0).toFixed(2),'текущий лимитный интервал')}
      ${ccCard('Токенов',tok(tin+tout),`↓${tok(tin)} вход · ↑${tok(tout)} выход`)}
      ${ccCard('Доля cache-read',cacheShare+'%',cacheShare>=70?'хорошо — кэш греется':'можно лучше')}
      ${ccCard('Проектов',projs.length,flagged?`${flagged} с флагом ⚑`:'аномалий нет')}
    </div>
    <div class="section-h">Расход по дням</div>
    ${dayEntries.length?`<div class="daybars">${bars}</div>
    <table class="cost-table">
      <thead><tr><th>Дата</th><th>Сообщ.</th><th title="вход / выход">↓ / ↑ токены</th><th title="доля от периода">доля</th><th>$ за день</th></tr></thead>
      <tbody>${dayRows}</tbody></table>`:'<div class="empty">Нет данных за период</div>'}
    ${renderByModel(d.by_model,days)}
    <div class="section-h">По проектам</div>
    ${projs.length?`<table class="cost-table">
      <thead><tr><th>Проект</th><th>Сообщ.</th><th title="вход / выход">↓ / ↑ токены</th><th title="доля cache_read — выше лучше">cache</th><th>$ за период</th></tr></thead>
      <tbody>${projs.map(p=>{const f=flag(p);const share=(p.input+p.cache_read)?Math.round(p.cache_read/(p.input+p.cache_read)*100):0;
        return `<tr class="${f?'warn':''}"><td>${esc(p.project)}${f?`<span class="flag" title="${esc(f)}">⚑ оптимизировать</span>`:''}</td>
        <td>${p.messages}</td>
        <td>${tok(p.input)} / ${tok(p.output)}</td>
        <td>${share}%</td>
        <td class="c-usd">$${p.cost.toFixed(p.cost<0.01?4:2)}</td></tr>`;}).join('')}</tbody>
    </table>`:'<div class="empty"><div class="big">⛁</div>Нет сессий за период.</div>'}
    <p class="note" style="margin-top:18px">💡 Учитываются ВСЕ сессии Claude Code (~/.claude/projects): терминал, IDE, prof. Стоимость — вход+выход (реальная генерация), без раздутого cache_read. Флаг ⚑ — высокий output/сообщение или низкий cache-hit: кандидаты на оптимизацию промптов.</p>`;
}

    <button class="btn ghost sm" onclick="restartProf()">↻ Перезапустить prof</button>
    <button class="btn ghost sm" onclick="setRemote()">⎇ Remote</button>
    <button class="btn" onclick="backupNow()">⬆ Бэкап сейчас</button></div>
    <div class="field" style="max-width:520px"><label>Obsidian vault (для синка задач)</label>
      <div style="display:flex;gap:8px"><input id="ov" placeholder="~/ObsidianVault/prof"><button class="btn ghost sm" onclick="saveVault()">сохранить</button>
      <button class="btn green sm" onclick="syncObsidian()">синк</button></div></div>
    <div class="field" style="max-width:520px"><label>Telegram-уведомления <span id="tgBadge" class="muted"></span></label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input id="tgTok" placeholder="bot token" style="flex:1 1 200px">
      <input id="tgChat" placeholder="chat_id" style="flex:0 0 120px">
      <button class="btn ghost sm" onclick="saveTg()">сохранить</button>
      <button class="btn green sm" onclick="testTg()">Тест</button></div>
      <div class="muted" style="font-size:12px;margin-top:4px">env PROF_TG_BOT_TOKEN/PROF_TG_CHAT_ID имеют приоритет</div></div>
    <div class="section-h">История коммитов</div>
    ${log.map(c=>`<div class="svc"><span class="dot up"></span>
      <code style="flex:0 0 70px;color:var(--clay)">${c.hash}</code>
      <div style="flex:1">${esc(c.subject)}</div><span class="muted">${c.ago} назад</span></div>`).join('')||'<div class="empty">Нет коммитов</div>'}`;
  api('/api/obsidian/vault').then(d=>{if($('#ov'))$('#ov').value=d.vault;});

async function backupNow(){const r=await post('/api/git/backup');toast(r.committed?'Закоммичено'+(r.pushed?' и запушено':''):'Нет изменений',{title:'Git',type:'ok'});viewGit($('#main'));}
async function setRemote(){const url=await showPrompt('GitHub remote URL (https://...git):',{title:'⎇ Remote',placeholder:'https://...git'});if(!url)return;
  const r=await post('/api/git/remote',{url});toast(r.ok?'Remote добавлен':'Ошибка: '+r.error,{title:'Git remote',type:r.ok?'ok':'err'});}
async function saveVault(){await post('/api/obsidian/vault',{path:$('#ov').value});toast('Сохранено',{title:'Obsidian',type:'ok'});}
async function syncObsidian(){const r=await post('/api/obsidian/sync');toast(`Синк: ${r.synced_boards} досок → ${r.vault}`,{title:'Obsidian',type:'ok'});}
function refreshTgBadge(){api('/api/settings/telegram').then(d=>{const b=$('#tgBadge');if(b)b.textContent=d.configured?'TG ✓':'TG ✗';});}
async function saveTg(){await post('/api/settings/telegram',{token:$('#tgTok').value,chat_id:$('#tgChat').value});$('#tgTok').value='';toast('Сохранено',{title:'Telegram',type:'ok'});refreshTgBadge();}
async function testTg(){const r=await api('/api/notify/test');toast(r.ok?'Отправлено — проверь Telegram':'Не отправлено: '+(r.detail||'ошибка'),{title:'Telegram',type:r.ok?'ok':'err'});}
async function applyCode(){
  const ok=await showConfirm('Подхватить свежий код с диска (uvicorn reload). Веб-воркер пересоздастся за ~1-2с, claude-задачи переживут. Применять лучше, когда нет активных задач.',
    {title:'⟳ Применить код',okText:'Применить'});
  if(!ok)return;
  try{
    const r=await post('/api/apply-code');
    toast(`Код применён${r.running?` (активных задач: ${r.running} — reaper перезапустится)`:''}. Обнови страницу через пару секунд.`,
      {title:'⟳ Reload',type:'ok'});
  }catch(e){toast('Не удалось: '+e,{title:'Ошибка',type:'err'});}
}
async function restartProf(){
  const chk=await api('/api/restart/check');
  let force=false;
  if(!chk.can_restart){
    const list=chk.running.map(r=>'• '+esc(r.title)).join('<br>');
    const ok=await showConfirm(`Сейчас выполняется ${chk.running.length} задач:<br>${list}<br><br>Перезапуск <b>ПРЕРВЁТ</b> их. Всё равно перезапустить?`,
      {title:'⚠️ Активные задачи',okText:'Перезапустить',danger:true});
    if(!ok)return;
    force=true;
  } else {
    const ok=await showConfirm('Активных задач нет, бэкап сделается автоматически.',
      {title:'↻ Перезапустить prof?',okText:'Перезапустить'});
    if(!ok)return;
  }
  try{
    const r=await post('/api/restart',{force});
    showModal('<h2>↻ Перезапуск…</h2><p class="md">Сервис перезапускается'+(r.interrupted?` (прервано задач: ${r.interrupted})`:'')+'. Страница обновится через 4 секунды.</p>');
    setTimeout(()=>location.reload(),4000);
  }catch(e){toast('Не удалось перезапустить: '+e,{title:'Ошибка',type:'err'});}
}

/* ---- модалка ---- */
function showModal(h,wide){$('#modal').classList.toggle('wide',!!wide);$('#modal').innerHTML='<button class="modal-x" title="Закрыть" onclick="closeModal()">×</button>'+h;$('#overlay').classList.add('show');hl($('#modal'));applyI18n($('#modal'));}
function closeModal(){$('#overlay').classList.remove('show');S.openCardId=null;stopSpeak();}
/* модалки закрываются только по кнопкам — клик по фону и Escape не закрывают,
   чтобы мисклики/выделение текста не теряли введённое */

/* ---- стилизованные диалоги (замена нативных confirm/alert/prompt) ----
   Отдельный слой dlg-overlay, чтобы открываться поверх основной модалки. */
function _closeDlg(){$('#dlg-overlay').classList.remove('show');$('#dlg-modal').innerHTML='';}
/* ---- тосты (уведомления в правом нижнем углу) ---- */
function toast(msg,{title='',type='info',timeout=6000}={}){
  const c=$('#toasts');if(!c)return;
  const ico={ok:'✓',err:'✕',info:'ℹ'}[type]||'ℹ';
  const el=document.createElement('div');el.className='toast '+type;
  el.innerHTML=`<span class="t-ico">${ico}</span><div class="t-body">${title?`<div class="t-title">${esc(title)}</div>`:''}<div class="t-msg">${msg}</div></div><span class="t-x">×</span>`;
  const close=()=>{el.classList.add('out');setTimeout(()=>el.remove(),200);};
  el.querySelector('.t-x').onclick=close;
  c.appendChild(el);
  applyI18n(el);
  if(timeout)setTimeout(close,timeout);
}
function showConfirm(message,{title='Подтверждение',okText='OK',cancelText='Отмена',danger=false}={}){
  return new Promise(res=>{
    $('#dlg-modal').innerHTML=`<h2>${esc(title)}</h2><div class="md">${message}</div>
      <div class="m-actions"><button class="btn ghost" id="dlg-no">${esc(cancelText)}</button>
      <button class="btn ${danger?'danger':''}" id="dlg-yes">${esc(okText)}</button></div>`;
    $('#dlg-overlay').classList.add('show');applyI18n($('#dlg-modal'));
    $('#dlg-yes').onclick=()=>{_closeDlg();res(true);};
    $('#dlg-no').onclick=()=>{_closeDlg();res(false);};
  });
}
function showAlert(message,{title='',okText='OK'}={}){
  return new Promise(res=>{
    $('#dlg-modal').innerHTML=`${title?`<h2>${esc(title)}</h2>`:''}<div class="md">${message}</div>
      <div class="m-actions"><button class="btn" id="dlg-ok">${esc(okText)}</button></div>`;
    $('#dlg-overlay').classList.add('show');applyI18n($('#dlg-modal'));
    $('#dlg-ok').onclick=()=>{_closeDlg();res();};
  });
}
function showPrompt(message,{title='Ввод',value='',placeholder='',okText='OK'}={}){
  return new Promise(res=>{
    $('#dlg-modal').innerHTML=`<h2>${esc(title)}</h2><div class="md" style="margin-bottom:10px">${message}</div>
      <div class="field"><input id="dlg-input" value="${esc(value)}" placeholder="${esc(placeholder)}"></div>
      <div class="m-actions"><button class="btn ghost" id="dlg-cancel">Отмена</button>
      <button class="btn" id="dlg-okp">${esc(okText)}</button></div>`;
    $('#dlg-overlay').classList.add('show');applyI18n($('#dlg-modal'));
    const inp=$('#dlg-input');inp.focus();inp.select();
    const ok=()=>{const v=inp.value;_closeDlg();res(v);};
    $('#dlg-okp').onclick=ok;
    inp.onkeydown=e=>{if(e.key==='Enter')ok();};
    $('#dlg-cancel').onclick=()=>{_closeDlg();res(null);};
  });
}
